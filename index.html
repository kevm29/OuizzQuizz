<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OuizzQuizz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/strates.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" id="home-link" type="button" aria-label="Retour à l'accueil">
      <span class="brand-mark" aria-hidden="true"></span>OuizzQuizz
    </button>
    <div class="volume">
      <button type="button" id="mute-btn" class="vol-btn" aria-label="Couper le son">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4z"/><path id="vol-waves" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
      </button>
      <input type="range" id="volume" min="0" max="100" step="1" aria-label="Volume">
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <footer class="credits">
    Extraits de 30 s fournis par l'API publique iTunes (Apple), avec Deezer en secours. Aucun fichier audio n'est hébergé par le jeu. Multijoueur en pair-à-pair via PeerJS.
  </footer>

  <!-- Scripts classiques (pas de modules ES) : le jeu marche aussi en double-cliquant sur index.html. -->
  <script src="js/vendor/peerjs.min.js"></script>
  <script src="js/core/registry.js"></script>
  <script src="js/core/audio-source.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/match.js"></script>
  <script src="js/core/net.js"></script>
  <script src="js/data/big-catalog.js"></script>
  <script src="js/data/catalog.js"></script>
  <script src="js/games/blindtest/engine.js"></script>
  <script src="js/games/blindtest/view.js"></script>
  <script src="js/games/strates.js"></script>
  <!-- Ajouter les futurs sous-jeux ici : js/games/<nom>.js -->
  <script src="js/app.js"></script>
</body>
</html>
